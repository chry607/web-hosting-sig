<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Codeforces</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Mini<span>Forces</span></h1>
    <input id="user" placeholder="your handle" maxlength="20"></header>
  <main>
    <section>
      <h2>Problemset</h2>
      <table id="problems"><thead><tr><th>#</th><th>Name</th><th>Rating</th></tr></thead><tbody></tbody></table>
      <div id="detail" hidden>
        <h3 id="ptitle"></h3>
        <p id="pstatement"></p>
        <pre id="psample"></pre>
        <p><a id="pinput" target="_blank">Download test input</a> · compute the answer however you like, then paste it:</p>
        <form id="form"><input id="answer" placeholder="your answer" required><button>Submit</button></form>
        <p id="verdict"></p>
      </div>
    </section>
    <aside>
      <h2>Leaderboard</h2>
      <table id="board"><thead><tr><th>User</th><th>Solved</th><th>Tries</th></tr></thead><tbody></tbody></table>
      <h2>Recent submissions</h2>
      <table id="subs"><thead><tr><th>User</th><th>Prob</th><th>Verdict</th></tr></thead><tbody></tbody></table>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
